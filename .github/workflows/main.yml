name: AccuKnox ASPM CI/CD Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  accuknox-aspm-scan:
    name: Run AccuKnox Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Log in to Public ECR to prevent "toomanyrequests" rate limits
      - name: Authenticate Docker to AWS Public ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 --no-sign-request | docker login --username AWS --password-stdin public.ecr.aws

      # 1. Secret Scanner
      - name: AccuKnox Secret Scanner
        uses: accuknox/secret-scan-action@latest
        continue-on-error: true
        with:
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_label: ${{ secrets.ACCUKNOX_LABEL }}
          soft_fail: "true"

      # 2. Infrastructure as Code (IaC) Scanner
      - name: AccuKnox IaC Scanner
        uses: accuknox/iac-scan-action@latest
        continue-on-error: true
        with:
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_label: ${{ secrets.ACCUKNOX_LABEL }}
          soft_fail: "true"

      # 3. SAST Scanner
      - name: AccuKnox SAST Scanner
        uses: accuknox/sast-scan-opengrep-action@latest
        continue-on-error: true
        with:
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_label: ${{ secrets.ACCUKNOX_LABEL }}
          soft_fail: "true"
