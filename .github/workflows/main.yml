name: AccuKnox ASPM CI/CD Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  accuknox-aspm-scan:
    name: Run AccuKnox Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Pre-pull from Docker Hub & tag locally to bypass AWS ECR rate limit
      - name: Pre-cache Scanner Docker Images
        run: |
          docker pull trufflesecurity/trufflehog:3.90.3
          docker tag trufflesecurity/trufflehog:3.90.3 public.ecr.aws/k9v9d5v2/trufflesecurity/trufflehog:3.90.3
          docker pull bridgecrew/checkov:3.2.458
          docker tag bridgecrew/checkov:3.2.458 public.ecr.aws/k9v9d5v2/bridgecrew/checkov:3.2.458

      # 1. Secret Scanner
      - name: AccuKnox Secret Scanner
        uses: accuknox/secret-scan-action@latest
        continue-on-error: true
        with:
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_label: ${{ secrets.ACCUKNOX_LABEL }}
          soft_fail: "true"

      # 2. IaC Scanner
      - name: AccuKnox IaC Scanner
        uses: accuknox/iac-scan-action@latest
        continue-on-error: true
        with:
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_label: ${{ secrets.ACCUKNOX_LABEL }}
          soft_fail: "true"

      # 3. SAST Scanner
      - name: AccuKnox SAST Scanner
        uses: accuknox/sast-scan-opengrep-action@latest
        continue-on-error: true
        with:
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_label: ${{ secrets.ACCUKNOX_LABEL }}
          soft_fail: "true"
