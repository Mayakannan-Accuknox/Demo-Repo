name: AccuKnox ASPM CI/CD Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  accuknox-aspm-scan:
    name: AccuKnox ASPM Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run AccuKnox Unified ASPM Scanner
        uses: accuknox/accuknox-code-analysis@latest
        with:
          scan_type: "sast, secret, iac"
          token: ${{ secrets.ACCUKNOX_TOKEN }}
          endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          label: ${{ secrets.ACCUKNOX_LABEL }}
          soft_fail: true
